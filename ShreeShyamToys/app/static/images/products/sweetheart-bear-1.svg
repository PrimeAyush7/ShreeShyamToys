<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
      <rect width="500" height="500" fill="#FBF8F5" rx="24" />
      <circle cx="250" cy="230" r="140" fill="#FFDEE9" opacity="0.4" />
      <!-- Plush Figure Body -->
      <ellipse cx="250" cy="300" rx="110" ry="120" fill="#FFB4B4" />
      <ellipse cx="250" cy="310" rx="75" ry="85" fill="#FFDEE9" opacity="0.6" />
      <!-- Left Ear & Right Ear -->
      <circle cx="170" cy="110" r="45" fill="#FFB4B4" />
      <circle cx="170" cy="110" r="25" fill="#FFDEE9" />
      <circle cx="330" cy="110" r="45" fill="#FFB4B4" />
      <circle cx="330" cy="110" r="25" fill="#FFDEE9" />
      <!-- Head -->
      <circle cx="250" cy="180" r="105" fill="#FFB4B4" />
      <!-- Muzzle -->
      <ellipse cx="250" cy="205" rx="50" ry="38" fill="#FFDEE9" />
      <polygon points="250,195 235,178 265,178" fill="#22150C" />
      <path d="M240,215 Q250,225 260,215" stroke="#22150C" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Eyes with catchlight -->
      <circle cx="205" cy="160" r="12" fill="#1B120C" />
      <circle cx="208" cy="156" r="4" fill="#FFFFFF" />
      <circle cx="295" cy="160" r="12" fill="#1B120C" />
      <circle cx="298" cy="156" r="4" fill="#FFFFFF" />
      <!-- Soft toy bow -->
      <polygon points="250,265 210,240 210,290" fill="#E56B6F" />
      <polygon points="250,265 290,240 290,290" fill="#E56B6F" />
      <circle cx="250" cy="265" r="12" fill="#B56576" />
      <!-- Quality Badge -->
      <rect x="35" y="35" width="130" height="32" rx="16" fill="#8B4513" />
      <text x="100" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">WHOLESALE</text>
      <!-- Title text -->
      <text x="250" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#3D2314" text-anchor="middle">Sweetheart Blush Bear</text>

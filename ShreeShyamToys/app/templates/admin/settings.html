{% extends "admin/base_admin.html" %}

{% block page_title %}Global Website Settings{% endblock %}

{% block admin_content %}
{% if success %}
<div style="background: #D1FAE5; border: 1px solid #6EE7B7; color: #065F46; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-weight: 600; font-size: 14px;">
  {{ success }}
</div>
{% endif %}

<div class="admin-card" style="max-width: 860px;">
  <form action="/admin/settings/save" method="POST">
    
    <h3 style="font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 20px; border-bottom: 1px solid #E5E7EB; padding-bottom: 12px;">Branding &amp; Meta</h3>
    
    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Business Name</label>
        <input type="text" name="business_name" class="form-control" value="{{ settings.business_name or 'Shree Shyam Toys' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Website Browser Title</label>
        <input type="text" name="website_title" class="form-control" value="{{ settings.website_title or '' }}">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Global Meta Description (SEO)</label>
      <textarea name="meta_description" class="form-control" rows="2">{{ settings.meta_description or '' }}</textarea>
    </div>

    <div class="form-grid-3">
      <div class="form-group">
        <label class="form-label">Logo Path / URL</label>
        <input type="text" name="logo_url" class="form-control" value="{{ settings.logo_url or '/static/images/logo.svg' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Favicon Path / URL</label>
        <input type="text" name="favicon_url" class="form-control" value="{{ settings.favicon_url or '/static/images/favicon.ico' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Social Share (OG) Image URL</label>
        <input type="text" name="og_image_url" class="form-control" value="{{ settings.og_image_url or '/static/images/og-image.png' }}">
      </div>
    </div>

    <h3 style="font-size: 16px; font-weight: 800; color: #111827; margin-top: 32px; margin-bottom: 20px; border-bottom: 1px solid #E5E7EB; padding-bottom: 12px;">Wholesale Contact &amp; WhatsApp Integration</h3>

    <div class="form-grid-3">
      <div class="form-group">
        <label class="form-label">WhatsApp Business Number *</label>
        <input type="text" name="whatsapp_number" class="form-control" value="{{ settings.whatsapp_number or '' }}" placeholder="Country code + number, no + (e.g. 9198XXXXXXXX)" required>
      </div>
      <div class="form-group">
        <label class="form-label">Display Phone Number</label>
        <input type="text" name="phone" class="form-control" value="{{ settings.phone or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Official Email</label>
        <input type="email" name="email" class="form-control" value="{{ settings.email or 'contact@shreeshyamtoys.com' }}">
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Physical Commercial / Office Address</label>
        <input type="text" name="address" class="form-control" value="{{ settings.address or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Business Hours</label>
        <input type="text" name="business_hours" class="form-control" value="{{ settings.business_hours or 'Mon - Sat: 9:30 AM - 7:00 PM IST' }}">
      </div>
    </div>

    <h3 style="font-size: 16px; font-weight: 800; color: #111827; margin-top: 32px; margin-bottom: 20px; border-bottom: 1px solid #E5E7EB; padding-bottom: 12px;">Announcement Bar &amp; Footer Text</h3>

    <div class="form-group">
      <label class="form-label">Announcement Text</label>
      <input type="text" name="announcement_text" class="form-control" value="{{ settings.announcement_text or '' }}">
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Announcement Link</label>
        <input type="text" name="announcement_link" class="form-control" value="{{ settings.announcement_link or '/catalogue' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Announcement Bar Active</label>
        <select name="announcement_enabled" class="form-control">
          <option value="true" {% if settings.announcement_enabled == 'true' %}selected{% endif %}>Enabled (Visible)</option>
          <option value="false" {% if settings.announcement_enabled == 'false' %}selected{% endif %}>Disabled (Hidden)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Footer Summary Paragraph</label>
      <textarea name="footer_text" class="form-control" rows="3">{{ settings.footer_text or '' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Copyright Notice</label>
      <input type="text" name="copyright_text" class="form-control" value="{{ settings.copyright_text or '' }}">
    </div>

    <div style="margin-top: 32px;">
      <button type="submit" class="btn btn-primary btn-lg">Save Global Settings &rarr;</button>
    </div>
  </form>
</div>
{% endblock %}

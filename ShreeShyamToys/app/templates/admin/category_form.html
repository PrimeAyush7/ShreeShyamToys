{% extends "admin/base_admin.html" %}

{% block page_title %}{% if is_edit %}Edit Category: {{ category.name }}{% else %}New Category{% endif %}{% endblock %}

{% block admin_content %}
<div style="margin-bottom: 20px;">
  <a href="/admin/categories" style="color: var(--primary); font-weight: 700; font-size: 13px;">&larr; Back to Categories</a>
</div>

<div class="admin-card" style="max-width: 680px;">
  <form action="{% if is_edit %}/admin/categories/{{ category.id }}/edit{% else %}/admin/categories/new{% endif %}" method="POST">
    <div class="form-group">
      <label class="form-label">Category Name *</label>
      <input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" required placeholder="e.g. Classic Teddy Bears">
    </div>

    <div class="form-group">
      <label class="form-label">Category Description</label>
      <textarea name="description" class="form-control" rows="3" placeholder="Brief summary of this wholesale line...">{{ category.description if category else '' }}</textarea>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Display Order Index</label>
        <input type="number" name="display_order" class="form-control" value="{{ category.display_order if category else 0 }}">
      </div>
      <div class="form-group">
        <label class="form-label">Category Image / SVG URL</label>
        <input type="text" name="image_url" class="form-control" value="{{ category.image_url if category else '' }}" placeholder="/static/images/cat-classic-bears.svg">
      </div>
    </div>

    <div class="form-group">
      <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
        <input type="checkbox" name="is_active" value="true" {% if not category or category.is_active %}checked{% endif %}>
        Category is Active (Visible on Public Website)
      </label>
    </div>

    <h4 style="font-size: 15px; font-weight: 800; margin-top: 24px; margin-bottom: 16px; border-top: 1px solid #E5E7EB; padding-top: 16px;">SEO Settings</h4>

    <div class="form-group">
      <label class="form-label">SEO Page Title</label>
      <input type="text" name="seo_title" class="form-control" value="{{ category.seo_title if category else '' }}" placeholder="e.g. Classic Teddy Bears Wholesale | Shree Shyam Toys">
    </div>

    <div class="form-group">
      <label class="form-label">SEO Meta Description</label>
      <textarea name="seo_description" class="form-control" rows="2">{{ category.seo_description if category else '' }}</textarea>
    </div>

    <div style="margin-top: 28px; display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary btn-lg">{% if is_edit %}Save Category{% else %}Create Category{% endif %}</button>
      <a href="/admin/categories" class="btn btn-outline btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
